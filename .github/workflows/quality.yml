name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
    defaults:
      run:
        working-directory: plugin/tagcore
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer package
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP quality checks
        run: composer check

  javascript:
    name: JavaScript and assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run JavaScript quality checks
        run: npm run check

  integration:
    name: WordPress ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: wordpress-7.0.2-woocommerce-10.9.4
            config: ''
          - environment: wordpress-7.0.2-woocommerce-9.9.7
            config: '--config=.wp-env.woocommerce-9.json'
          - environment: wordpress-6.9.5-woocommerce-10.9.4
            config: '--config=.wp-env.minimum.json'
          - environment: wordpress-6.9.5-woocommerce-9.9.7
            config: '--config=.wp-env.minimum-woocommerce-9.json'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          npm ci
          composer install --working-dir=plugin/tagcore --no-interaction --prefer-dist

      - name: Start WordPress
        run: npx wp-env start ${{ matrix.config }}

      - name: Enable WooCommerce HPOS
        run: npx wp-env run ${{ matrix.config }} tests-cli wp option update woocommerce_custom_orders_table_enabled yes

      - name: Run WordPress integration tests
        run: npx wp-env run ${{ matrix.config }} tests-cli --env-cwd=wp-content/plugins/tagcore composer test:integration

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop ${{ matrix.config }}

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          npm ci
          composer install --working-dir=plugin/tagcore --no-interaction --prefer-dist
          npx playwright install --with-deps chromium firefox webkit

      - name: Start WordPress
        run: npx wp-env start

      - name: Run browser tests
        run: npm run test:e2e

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
