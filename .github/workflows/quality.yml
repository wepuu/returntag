name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      classifier_ok: ${{ steps.changes.outputs.classifier_ok }}
      database_sensitive: ${{ steps.changes.outputs.database_sensitive }}
      docs_changed: ${{ steps.changes.outputs.docs_changed }}
      full_e2e: ${{ steps.changes.outputs.full_e2e }}
      mode: ${{ steps.changes.outputs.mode }}
      runtime_changed: ${{ steps.changes.outputs.runtime_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-changes.mjs --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  documentation:
    name: Documentation
    needs: classify
    if: needs.classify.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check documentation, design manifest, and secrets
        run: node scripts/check-docs.mjs

  php:
    name: PHP ${{ matrix.php }}
    needs: classify
    if: needs.classify.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
    defaults:
      run:
        working-directory: plugin/tagcore
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer package
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHP quality checks
        run: composer check

  javascript:
    name: JavaScript and assets
    needs: classify
    if: needs.classify.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run JavaScript quality checks
        run: npm run check

  integration:
    name: WordPress ${{ matrix.environment }}
    needs: classify
    if: needs.classify.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: wordpress-7.0.2-woocommerce-10.9.4
            config: ''
          - environment: wordpress-7.0.2-woocommerce-9.9.7
            config: '--config=.wp-env.woocommerce-9.json'
          - environment: wordpress-6.9.5-woocommerce-10.9.4
            config: '--config=.wp-env.minimum.json'
          - environment: wordpress-6.9.5-woocommerce-9.9.7
            config: '--config=.wp-env.minimum-woocommerce-9.json'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          npm ci
          composer install --working-dir=plugin/tagcore --no-interaction --prefer-dist

      - name: Start WordPress
        run: npx wp-env start ${{ matrix.config }}

      - name: Run WordPress integration tests
        run: npx wp-env run ${{ matrix.config }} tests-cli --env-cwd=wp-content/plugins/tagcore composer test:integration

      - name: Activate plugins and verify ForgeTag Theme
        run: |
          npx wp-env run ${{ matrix.config }} tests-cli wp plugin activate tagcore woocommerce
          npx wp-env run ${{ matrix.config }} tests-cli wp theme activate forge-tag
          npx wp-env run ${{ matrix.config }} tests-cli wp eval '$theme = wp_get_theme(); if (get_stylesheet() !== "forge-tag" || $theme->get("Version") !== "0.1.0" || $theme->get("TextDomain") !== "forge-tag") { WP_CLI::error("ForgeTag Theme identity contract failed."); }'

      - name: Enable WooCommerce HPOS
        run: |
          npx wp-env run ${{ matrix.config }} tests-cli wp option update woocommerce_custom_orders_table_enabled yes
          npx wp-env run ${{ matrix.config }} tests-cli wp option update woocommerce_coming_soon no

      - name: Verify ForgeTag commerce template resolution
        run: |
          npx wp-env run ${{ matrix.config }} tests-cli wp eval '$templates = array("archive-product" => "forge-commerce--catalog", "page-cart" => "forge-commerce--cart", "page-checkout" => "forge-commerce--checkout"); foreach ($templates as $slug => $marker) { $template = get_block_template(get_stylesheet() . "//" . $slug, "wp_template"); if (!$template instanceof WP_Block_Template || !str_contains($template->content, $marker)) { WP_CLI::error("ForgeTag {$slug} Template resolution contract failed."); } }'

      - name: Verify the ForgeTag and TagCore entry contract
        run: |
          npx wp-env run ${{ matrix.config }} tests-cli wp eval '$block = WP_Block_Type_Registry::get_instance()->get_registered("tagcore/tag-entry-link"); if (!$block) { WP_CLI::error("TagCore entry block is not registered."); } $home = wp_remote_get(home_url("/")); $body = is_wp_error($home) ? "" : wp_remote_retrieve_body($home); if (is_wp_error($home) || wp_remote_retrieve_response_code($home) !== 200 || substr_count($body, "data-returntag-tag-entry=\"activate\"") !== 2 || substr_count($body, "data-returntag-tag-entry=\"report\"") !== 2) { WP_CLI::error("ForgeTag entry placement contract failed."); } foreach (array("activate", "report") as $intent) { $response = wp_remote_get(home_url("/tag/{$intent}/")); if (is_wp_error($response) || wp_remote_retrieve_response_code($response) !== 200 || wp_remote_retrieve_header($response, "cache-control") !== "no-store, private" || wp_remote_retrieve_header($response, "referrer-policy") !== "no-referrer" || !str_contains(wp_remote_retrieve_body($response), "returntag-entry-page")) { WP_CLI::error("TagCore {$intent} entry contract failed."); } }'

      - name: Verify TagCore entry without WooCommerce
        run: |
          npx wp-env run ${{ matrix.config }} tests-cli wp plugin deactivate woocommerce
          npx wp-env run ${{ matrix.config }} tests-cli wp eval '$response = wp_remote_get(home_url("/")); $body = is_wp_error($response) ? "" : wp_remote_retrieve_body($response); if (is_wp_error($response) || wp_remote_retrieve_response_code($response) !== 200 || substr_count($body, "data-returntag-tag-entry=\"activate\"") !== 2 || substr_count($body, "data-returntag-tag-entry=\"report\"") !== 2) { WP_CLI::error("ForgeTag and TagCore entry failed without WooCommerce."); }'

      - name: Verify TagCore routes with a replacement Theme
        run: |
          npx wp-env run ${{ matrix.config }} tests-cli wp theme activate twentytwentyfive
          npx wp-env run ${{ matrix.config }} tests-cli wp eval 'foreach (array("activate", "report") as $intent) { $response = wp_remote_get(home_url("/tag/{$intent}/")); if (is_wp_error($response) || wp_remote_retrieve_response_code($response) !== 200 || !str_contains(wp_remote_retrieve_body($response), "returntag-entry-page")) { WP_CLI::error("TagCore {$intent} entry depends on ForgeTag Theme."); } } $scan = wp_remote_get(home_url("/t/A7R2W9/")); if (is_wp_error($scan) || wp_remote_retrieve_response_code($scan) !== 404 || !str_contains(wp_remote_retrieve_body($scan), "returntag-public-page")) { WP_CLI::error("Canonical Tag route depends on ForgeTag Theme."); }'

      - name: Verify the brand shell fails safely without TagCore
        run: |
          npx wp-env run ${{ matrix.config }} tests-cli wp theme activate forge-tag
          npx wp-env run ${{ matrix.config }} tests-cli wp plugin deactivate tagcore
          npx wp-env run ${{ matrix.config }} tests-cli wp eval '$response = wp_remote_get(home_url("/")); $body = is_wp_error($response) ? "" : wp_remote_retrieve_body($response); if (is_wp_error($response) || wp_remote_retrieve_response_code($response) !== 200 || !str_contains($body, "Help what matters find its way back.") || str_contains($body, "data-returntag-tag-entry") || str_contains($body, "/tag/activate/") || str_contains($body, "/tag/report/")) { WP_CLI::error("ForgeTag did not fail safely without TagCore."); }'
          npx wp-env run ${{ matrix.config }} tests-cli wp plugin activate tagcore

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop ${{ matrix.config }}

  database-compatibility:
    name: Database ${{ matrix.environment }}
    needs: classify
    if: needs.classify.outputs.database_sensitive == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: mariadb-10.11
            image: mariadb:10.11
          - environment: mysql-8.0
            image: mysql:8.0
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_HOST: '%'
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=password --silent"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1:3306
      DB_NAME: wordpress_test
      DB_PASSWORD: password
      DB_USER: root
      WP_DEVELOP_DIR: ${{ github.workspace }}/.wordpress-develop
      WP_TESTS_DIR: ${{ github.workspace }}/.wordpress-develop/tests/phpunit
      WP_VERSION: 7.0.2
      WP_ENVIRONMENT_TYPE: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --working-dir=plugin/tagcore --no-interaction --prefer-dist

      - name: Install WordPress test library
        run: bash .github/scripts/install-wordpress-tests.sh

      - name: Run database compatibility tests
        run: composer --working-dir=plugin/tagcore test:integration

  e2e:
    name: End-to-end
    needs:
      - classify
      - javascript
      - php
    if: >-
      always() &&
      needs.classify.outputs.runtime_changed == 'true' &&
      needs.javascript.result == 'success' &&
      needs.php.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install application dependencies
        run: |
          npm ci
          composer install --working-dir=plugin/tagcore --no-interaction --prefer-dist

      - name: Install PR browser engines
        if: needs.classify.outputs.full_e2e != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install full browser engines
        if: needs.classify.outputs.full_e2e == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build browser assets
        run: npm run build

      - name: Start WordPress
        run: npx wp-env start

      - name: Activate ForgeTag Theme
        run: |
          npx wp-env run cli wp theme activate forge-tag
          npx wp-env run cli wp option update woocommerce_coming_soon no

      - name: Run PR browser profile
        if: needs.classify.outputs.full_e2e != 'true'
        run: npm run test:e2e:pr

      - name: Run full browser profile
        if: needs.classify.outputs.full_e2e == 'true'
        run: npm run test:e2e

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - classify
      - documentation
      - php
      - javascript
      - integration
      - database-compatibility
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify every applicable check
        env:
          CLASSIFIER_OK: ${{ needs.classify.outputs.classifier_ok }}
          EXPECT_DATABASE: ${{ needs.classify.outputs.database_sensitive }}
          EXPECT_DOCS: ${{ needs.classify.outputs.docs_changed }}
          EXPECT_RUNTIME: ${{ needs.classify.outputs.runtime_changed }}
          RESULT_CLASSIFIER: ${{ needs.classify.result }}
          RESULT_DATABASE: ${{ needs.database-compatibility.result }}
          RESULT_DOCS: ${{ needs.documentation.result }}
          RESULT_E2E: ${{ needs.e2e.result }}
          RESULT_INTEGRATION: ${{ needs.integration.result }}
          RESULT_JAVASCRIPT: ${{ needs.javascript.result }}
          RESULT_PHP: ${{ needs.php.result }}
        run: node scripts/check-quality-gate.mjs
